name: Release Tyxter plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate release tag and plugin versions
        id: release
        run: node .github/release-metadata.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_RELEASE: ${{ steps.release.outputs.stable }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          flags=(--latest=false --prerelease)
          if [[ "$STABLE_RELEASE" == "true" ]]; then
            flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Tyxter plugin $RELEASE_TAG" --generate-notes "${flags[@]}"
